<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Coach</title>
<meta name="description" content="Personal chess trainer: analyse your Lichess / Chess.com games, find your weaknesses, train with puzzles from your own mistakes, endgame drills, a thinking test and an opening library.">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a30">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Chess Coach</span><span id="appVer">v26</span></div>
  <div class="topbar-right"><button id="installBtn" class="btn small hidden">Install</button><div class="player-pick"><select id="playerSelect" aria-label="Player"></select></div></div>
</header>
<div class="board-edge" aria-hidden="true"></div>
<div class="shell">
  <nav id="sections" class="mainnav" aria-label="Sections"></nav>
  <div class="content">
    <nav id="tabs" class="subnav" aria-label="Pages"></nav>
    <div id="jobBar" class="hidden"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span id="jobText" class="small"></span><span class="row" style="gap:6px;flex-wrap:nowrap"><button id="jobStop" class="btn secondary small hidden">Pause</button><button id="jobCancel" class="btn secondary small hidden" title="Stop now and drop the games that aren't done yet">Cancel</button></span></div><div class="bar" style="margin-top:6px"><div id="jobFill"></div></div></div>
    <main><h1 id="pageTitle"></h1><div id="view"></div></main>
    <footer>Chess Coach v26 · Stockfish 19 runs in your browser. Your data stays in this browser: use <b>Home → Log &amp; backup</b> to save it or move it to another device. <a href="https://github.com/official-stockfish/Stockfish" target="_blank" rel="noopener">Stockfish</a> (GPLv3) · Archivo font (OFL)</footer>
  </div>
</div>
<div id="toast" class="hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
