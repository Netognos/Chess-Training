<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach</title>
<meta name="description" content="Personal chess trainer: analyse your Lichess / Chess.com games, find your weaknesses, train with puzzles from your own mistakes and endgame drills.">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><img src="icons/icon-192.png" alt="" style="width:24px;height:24px;border-radius:6px;vertical-align:-5px;margin-right:6px">Chess Coach <span id="appVer" style="font-size:11px;font-weight:400;opacity:.5">v18</span></div>
  <div class="row" style="gap:8px"><button id="installBtn" class="btn small hidden">Install app</button><div class="player-pick"><select id="playerSelect" aria-label="Player"></select></div></div>
</header>
<div id="sections" class="sections"><button data-sec="analyse" class="active">Analyse</button><button data-sec="test">Test & profile</button></div>
<nav id="tabs"></nav>
<div id="jobBar" class="hidden"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span id="jobText" class="small"></span><button id="jobStop" class="btn secondary small hidden">Pause</button></div><div class="bar" style="margin-top:6px"><div id="jobFill"></div></div></div>
<main id="view"></main>
<div id="toast" class="hidden"></div>
<footer>Stockfish 19 runs in your browser · Your data stays in this browser: use <b>Log → Backup</b> to save it or move it to another device · <a href="https://github.com/official-stockfish/Stockfish" target="_blank" rel="noopener">Stockfish</a> (GPLv3)</footer>
<script type="module" src="app.js"></script>
</body>
</html>
